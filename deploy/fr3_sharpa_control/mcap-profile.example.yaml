session_id: REQUIRED-session-id
model_root: REQUIRED-materialized-model-directory
calibration_root: REQUIRED-calibration-directory
clock_mapping:
  source_clock_id: host_ros_clock
  method: ntp
  valid_from_ns: 0
  raw_reference: 0
  unix_reference_ns: 0
  scale_ns_per_tick: 1.0
  sync_state: REQUIRED
  uncertainty_ns: 0
devices:
- device_id: rig
  channels:
  - source_topic: /cam0/color/image_raw
    topic: /devices/cam0/cameras/color/color/image_h264
    type: foxglove_msgs/msg/CompressedVideo
    recording: enabled
    value_origin: measured
    source_type: sensor_msgs/msg/Image
    role: head
    crf: 18
    width: 640
    height: 400
    fps: 30
    color:
      range: limited
      matrix: bt709
      primaries: bt709
      transfer: iec61966-2-1
    color_source: 'REQUIRED: verify native full-range sRGB input before recording'
  - source_topic: /cam1/color/image_raw
    topic: /devices/cam1/cameras/color/color/image_h264
    type: foxglove_msgs/msg/CompressedVideo
    recording: enabled
    value_origin: measured
    source_type: sensor_msgs/msg/Image
    role: wrist_right
    crf: 16
    width: 640
    height: 400
    fps: 30
    color:
      range: limited
      matrix: bt709
      primaries: bt709
      transfer: iec61966-2-1
    color_source: 'REQUIRED: verify native full-range sRGB input before recording'
  - source_topic: /cam2/color/image_raw
    topic: /devices/cam2/cameras/color/color/image_h264
    type: foxglove_msgs/msg/CompressedVideo
    recording: enabled
    value_origin: measured
    source_type: sensor_msgs/msg/Image
    role: wrist_left
    crf: 16
    width: 640
    height: 400
    fps: 30
    color:
      range: limited
      matrix: bt709
      primaries: bt709
      transfer: iec61966-2-1
    color_source: 'REQUIRED: verify native full-range sRGB input before recording'
  - source_topic: /left/franka/joint_states
    topic: /devices/fr3_left/state/joints
    type: sensor_msgs/msg/JointState
    recording: enabled
    value_origin: measured
  - source_topic: /right/franka/joint_states
    topic: /devices/fr3_right/state/joints
    type: sensor_msgs/msg/JointState
    recording: enabled
    value_origin: measured
  - source_topic: /sharpa/left/joint_states
    topic: /devices/sharpa_left/state/joints
    type: sensor_msgs/msg/JointState
    recording: enabled
    value_origin: measured
  - source_topic: /sharpa/right/joint_states
    topic: /devices/sharpa_right/state/joints
    type: sensor_msgs/msg/JointState
    recording: enabled
    value_origin: measured
  - source_topic: /teleop/arm_commands
    topic: /devices/rig/action/source
    type: sensor_msgs/msg/JointState
    recording: enabled
    value_origin: derived
    source_type: teleop_interfaces/msg/ArmCommand
    adapter: arm_command
  - source_topic: /teleop/validated_arm_commands
    topic: /devices/fr3_left/action/command
    type: sensor_msgs/msg/JointState
    recording: enabled
    value_origin: derived
    adapter: split_gateway_command
    source_type: sensor_msgs/msg/JointState
    command_group: left_arm
    joint_names:
    - left_fr3_joint1
    - left_fr3_joint2
    - left_fr3_joint3
    - left_fr3_joint4
    - left_fr3_joint5
    - left_fr3_joint6
    - left_fr3_joint7
    unit: rad
    action_basis: absolute
    command_semantics: gateway_validated_target_not_measured_state
    source_joint_names:
    - left_fr3v2_joint1
    - left_fr3v2_joint2
    - left_fr3v2_joint3
    - left_fr3v2_joint4
    - left_fr3v2_joint5
    - left_fr3v2_joint6
    - left_fr3v2_joint7
    joint_name_mapping:
      left_fr3v2_joint1: left_fr3_joint1
      left_fr3v2_joint2: left_fr3_joint2
      left_fr3v2_joint3: left_fr3_joint3
      left_fr3v2_joint4: left_fr3_joint4
      left_fr3v2_joint5: left_fr3_joint5
      left_fr3v2_joint6: left_fr3_joint6
      left_fr3v2_joint7: left_fr3_joint7
    controller_id: teleop_safety_gateway
  - source_topic: /openpi/executed_joint_targets
    topic: /devices/sharpa_left/action/command
    type: sensor_msgs/msg/JointState
    recording: enabled
    value_origin: derived
    adapter: split_joint_command
    source_type: sensor_msgs/msg/JointState
    command_group: left_hand
    joint_names:
    - left_thumb_CMC_FE
    - left_thumb_CMC_AA
    - left_thumb_MCP_FE
    - left_thumb_MCP_AA
    - left_thumb_IP
    - left_index_MCP_FE
    - left_index_MCP_AA
    - left_index_PIP
    - left_index_DIP
    - left_middle_MCP_FE
    - left_middle_MCP_AA
    - left_middle_PIP
    - left_middle_DIP
    - left_ring_MCP_FE
    - left_ring_MCP_AA
    - left_ring_PIP
    - left_ring_DIP
    - left_pinky_CMC
    - left_pinky_MCP_FE
    - left_pinky_MCP_AA
    - left_pinky_PIP
    - left_pinky_DIP
    unit: rad
    action_basis: absolute
    command_semantics: sdk_submitted_target_not_measured_state
    controller_id: sharpa_sdk_direct
  - source_topic: /teleop/validated_arm_commands
    topic: /devices/fr3_right/action/command
    type: sensor_msgs/msg/JointState
    recording: enabled
    value_origin: derived
    adapter: split_gateway_command
    source_type: sensor_msgs/msg/JointState
    command_group: right_arm
    joint_names:
    - right_fr3_joint1
    - right_fr3_joint2
    - right_fr3_joint3
    - right_fr3_joint4
    - right_fr3_joint5
    - right_fr3_joint6
    - right_fr3_joint7
    unit: rad
    action_basis: absolute
    command_semantics: gateway_validated_target_not_measured_state
    source_joint_names:
    - right_fr3v2_joint1
    - right_fr3v2_joint2
    - right_fr3v2_joint3
    - right_fr3v2_joint4
    - right_fr3v2_joint5
    - right_fr3v2_joint6
    - right_fr3v2_joint7
    joint_name_mapping:
      right_fr3v2_joint1: right_fr3_joint1
      right_fr3v2_joint2: right_fr3_joint2
      right_fr3v2_joint3: right_fr3_joint3
      right_fr3v2_joint4: right_fr3_joint4
      right_fr3v2_joint5: right_fr3_joint5
      right_fr3v2_joint6: right_fr3_joint6
      right_fr3v2_joint7: right_fr3_joint7
    controller_id: teleop_safety_gateway
  - source_topic: /openpi/executed_joint_targets
    topic: /devices/sharpa_right/action/command
    type: sensor_msgs/msg/JointState
    recording: enabled
    value_origin: derived
    adapter: split_joint_command
    source_type: sensor_msgs/msg/JointState
    command_group: right_hand
    joint_names:
    - right_thumb_CMC_FE
    - right_thumb_CMC_AA
    - right_thumb_MCP_FE
    - right_thumb_MCP_AA
    - right_thumb_IP
    - right_index_MCP_FE
    - right_index_MCP_AA
    - right_index_PIP
    - right_index_DIP
    - right_middle_MCP_FE
    - right_middle_MCP_AA
    - right_middle_PIP
    - right_middle_DIP
    - right_ring_MCP_FE
    - right_ring_MCP_AA
    - right_ring_PIP
    - right_ring_DIP
    - right_pinky_CMC
    - right_pinky_MCP_FE
    - right_pinky_MCP_AA
    - right_pinky_PIP
    - right_pinky_DIP
    unit: rad
    action_basis: absolute
    command_semantics: sdk_submitted_target_not_measured_state
    controller_id: sharpa_sdk_direct
  - source_topic: /cam0/color/camera_info
    topic: /devices/cam0/cameras/color/color/camera_info
    type: sensor_msgs/msg/CameraInfo
    recording: enabled
  - source_topic: /cam1/color/camera_info
    topic: /devices/cam1/cameras/color/color/camera_info
    type: sensor_msgs/msg/CameraInfo
    recording: enabled
  - source_topic: /cam2/color/camera_info
    topic: /devices/cam2/cameras/color/color/camera_info
    type: sensor_msgs/msg/CameraInfo
    recording: enabled
  - source_topic: /tf_static
    topic: /tf_static
    type: tf2_msgs/msg/TFMessage
    recording: enabled
    snapshot: true
  - source_topic: /tf
    topic: /tf
    type: tf2_msgs/msg/TFMessage
    recording: enabled
  - source_topic: /dagger/frame
    topic: /devices/rig/action/ownership
    type: std_msgs/msg/Int8MultiArray
    recording: enabled
    source_type: std_msgs/msg/String
    adapter: dagger_ownership
    group_order:
    - left_arm
    - left_hand
    - right_arm
    - right_hand
    owner_codes:
      hold: 0
      policy: 1
      human: 2
  - source_topic: /dagger/events
    topic: /recording/events
    type: std_msgs/msg/String
    recording: enabled
  - source_topic: /teleop/arm_command_status
    source_type: teleop_interfaces/msg/ArmCommandStatus
    topic: /recording/gateway_feedback
    type: std_msgs/msg/String
    adapter: diagnostic_event
    recording: enabled
  action_space:
    control_mode: joint_position
    basis: absolute
    unit: rad
    command_order:
    - left_arm_7
    - left_hand_22
    - right_arm_7
    - right_hand_22
    command_semantics: per_group_sources_declared_below
    source_semantics: arm source target; ownership per sample; full control context
      in events.jsonl
    command_topics:
      left_arm: /devices/fr3_left/action/command
      left_hand: /devices/sharpa_left/action/command
      right_arm: /devices/fr3_right/action/command
      right_hand: /devices/sharpa_right/action/command
    storage_layout: four-joint-state-command-streams-v2
    arm_command_source: /teleop/validated_arm_commands
    command_semantics_by_group:
      left_arm: gateway_validated_target
      right_arm: gateway_validated_target
      left_hand: sdk_submitted_target
      right_hand: sdk_submitted_target
